[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-secret-scan"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["detect-secrets==1.5.0"]

[project.scripts]
clinic-secret-scan = "cli:main"

[tool.setuptools]
py-modules = ["cli", "scan", "baseline"]
